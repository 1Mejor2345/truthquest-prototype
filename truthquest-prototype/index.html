<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TruthQuest</title>

    <style>
      /* Esconder la barra superior de Google Translate */
      .skiptranslate iframe { display: none !important; }
      body { top: 0 !important; }
      #google_translate_element select {
        padding: 4px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: white;
        font-family: inherit;
        font-size: 12px;
        max-width: 100px;
      }
      .goog-te-gadget {
        font-family: inherit !important;
        font-size: 0px !important; /* hide powered by google text */
        color: transparent !important;
      }
      .goog-te-gadget img {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="google_translate_element" style="position: absolute; top: 16px; right: 16px; z-index: 99999;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
